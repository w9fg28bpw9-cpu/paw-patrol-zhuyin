<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幼兒汪汪隊注音學習卡</title>
<style>
:root{--ink:#29485c;--blue:#69c8f0;--yellow:#ffd85d;--shadow:0 6px 18px rgba(45,84,110,.12)}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#f7fcff,#fffaf1);min-height:100vh}
.wrap{width:min(1100px,96vw);margin:auto;padding:18px 0 36px}
.hero{text-align:center;padding:8px 10px 12px}
.hero h1{margin:4px 0;font-size:clamp(26px,5vw,42px)}
.hero p{margin:8px auto 0;max-width:760px;line-height:1.7;color:#527087}
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:12px;border:2px solid #cdeefe;border-radius:18px;background:#fffffff2;box-shadow:var(--shadow);margin-bottom:18px}
.controls input,.controls select{padding:10px 12px;border:2px solid #b8dff2;border-radius:12px;font-size:17px;background:#fff;color:var(--ink)}
.controls input{width:180px}
button{border:0;border-radius:14px;padding:11px 15px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
button:active{transform:translateY(2px);box-shadow:none}
.search{background:#e8f7ff}.random{background:var(--blue)}.all{background:var(--yellow)}.print{background:#dce8ef}
.status{text-align:center;margin:6px 0 14px;font-weight:900;color:#567}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:#fff;border:2px dashed #9bcde5;border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;break-inside:avoid}
.avatar{width:100%;aspect-ratio:1/1;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fff 0 25%,#ecf9ff 26% 55%,#dff2fb 56%);font-size:clamp(64px,10vw,110px)}
.name{font-size:clamp(22px,2.6vw,30px);font-weight:1000;margin:8px 0 8px}
.eng{font-size:12px;color:#789;margin-bottom:8px}
.zhuyin{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.zy{background:#fff;border:2px solid #a9d9ef;color:#235773;border-radius:9px;padding:5px 7px;font-weight:900;min-width:38px;text-align:center}
.role{margin-top:9px;font-size:13px;color:#58748a;text-align:center}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.controls input{width:150px}}
@page{size:A4 portrait;margin:8mm}
@media print{
 body{background:#fff}.wrap{width:100%;padding:0}.controls,.status,.hero p{display:none!important}
 .hero h1{font-size:18pt;margin:0 0 4mm}.grid{grid-template-columns:repeat(3,1fr);gap:4mm}
 .card{box-shadow:none;border:1.4pt dashed #8fbfd4;min-height:78mm;padding:3mm}
 .avatar{height:43mm;aspect-ratio:auto;font-size:52pt}.name{font-size:14pt}.zy{font-size:10pt}
}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <h1>🐾 幼兒汪汪隊注音學習卡</h1>
  <p>認角色、看中文字、讀注音。可以搜尋角色，也能指定注音符號，再隨機出題。</p>
</section>

<div class="controls">
  <input id="searchInput" type="search" placeholder="搜尋角色名稱">
  <select id="zhuyinSelect">
    <option value="">全部注音（混合）</option>
    <option>ㄅ</option><option>ㄆ</option><option>ㄇ</option><option>ㄈ</option>
    <option>ㄉ</option><option>ㄊ</option><option>ㄋ</option><option>ㄌ</option>
    <option>ㄍ</option><option>ㄎ</option><option>ㄏ</option><option>ㄐ</option>
    <option>ㄑ</option><option>ㄒ</option><option>ㄓ</option><option>ㄔ</option>
    <option>ㄕ</option><option>ㄖ</option><option>ㄗ</option><option>ㄘ</option>
    <option>ㄙ</option><option>ㄧ</option><option>ㄨ</option><option>ㄩ</option>
    <option>ㄚ</option><option>ㄛ</option><option>ㄜ</option><option>ㄝ</option>
    <option>ㄞ</option><option>ㄟ</option><option>ㄠ</option><option>ㄡ</option>
    <option>ㄢ</option><option>ㄣ</option><option>ㄤ</option><option>ㄥ</option><option>ㄦ</option>
  </select>
  <button class="search" id="searchBtn">🔍 搜尋</button>
  <button class="random" id="randomBtn">🎲 隨機出題</button>
  <button class="all" id="allBtn">🐾 全部角色</button>
  <button class="print" onclick="window.print()">🖨️ A4 列印</button>
</div>

<div class="status" id="status"></div>
<main class="grid" id="grid"></main>
</div>

<script>
"use strict";
const CHARACTERS = [
  {name:"阿奇", eng:"Chase", zhuyin:["ㄚ","ㄑㄧˊ"], emoji:"🐶", role:"警察狗狗"},
  {name:"毛毛", eng:"Marshall", zhuyin:["ㄇㄠˊ","ㄇㄠˊ"], emoji:"🐶", role:"消防狗狗"},
  {name:"天天", eng:"Skye", zhuyin:["ㄊㄧㄢ","ㄊㄧㄢ"], emoji:"🐶", role:"飛行狗狗"},
  {name:"小礫", eng:"Rubble", zhuyin:["ㄒㄧㄠˇ","ㄌㄧˋ"], emoji:"🐶", role:"工程狗狗"},
  {name:"灰灰", eng:"Rocky", zhuyin:["ㄏㄨㄟ","ㄏㄨㄟ"], emoji:"🐶", role:"回收與修理狗狗"},
  {name:"路馬", eng:"Zuma", zhuyin:["ㄌㄨˋ","ㄇㄚˇ"], emoji:"🐶", role:"水上救援狗狗"},
  {name:"珠珠", eng:"Everest", zhuyin:["ㄓㄨ","ㄓㄨ"], emoji:"🐶", role:"雪地救援狗狗"},
  {name:"莉柏蒂", eng:"Liberty", zhuyin:["ㄌㄧˋ","ㄅㄛˊ","ㄉㄧˋ"], emoji:"🐶", role:"城市救援夥伴"},
  {name:"萊德", eng:"Ryder", zhuyin:["ㄌㄞˊ","ㄉㄜˊ"], emoji:"🧑", role:"汪汪隊隊長"}
];

const grid=document.getElementById("grid");
const status=document.getElementById("status");
const searchInput=document.getElementById("searchInput");
const zhuyinSelect=document.getElementById("zhuyinSelect");

function card(c){
 return `<article class="card">
   <div class="avatar">${c.emoji}</div>
   <div class="name">${c.name}</div>
   <div class="eng">${c.eng}</div>
   <div class="zhuyin">${c.zhuyin.map(z=>`<span class="zy">${z}</span>`).join("")}</div>
   <div class="role">${c.role}</div>
 </article>`;
}
function render(list,label){
 grid.innerHTML=list.map(card).join("");
 status.textContent=label||`🐾 共 ${list.length} 位角色`;
}
function matchesSymbol(c,symbol){
 if(!symbol) return true;
 return c.zhuyin.some(z=>z.includes(symbol));
}
function search(){
 const q=searchInput.value.trim();
 const list=CHARACTERS.filter(c=>!q||c.name.includes(q)||c.eng.toLowerCase().includes(q.toLowerCase()));
 render(list,list.length?`🔍 找到 ${list.length} 位角色`:"🔍 找不到符合的角色");
}
function randomQuiz(){
 const symbol=zhuyinSelect.value;
 let pool=CHARACTERS.filter(c=>matchesSymbol(c,symbol));
 pool=[...pool].sort(()=>Math.random()-.5);
 const take=Math.min(6,pool.length);
 const list=pool.slice(0,take);
 if(!list.length){
   render([],`這一版目前沒有「${symbol}」的角色`);
   return;
 }
 render(list,symbol?`🎲 注音「${symbol}」：隨機 ${take} 位角色`:`🎲 混合隨機 ${take} 位角色`);
}
document.getElementById("searchBtn").addEventListener("click",search);
document.getElementById("randomBtn").addEventListener("click",randomQuiz);
document.getElementById("allBtn").addEventListener("click",()=>render(CHARACTERS));
searchInput.addEventListener("keydown",e=>{if(e.key==="Enter")search()});
render(CHARACTERS);
</script>
</body>
</html>
